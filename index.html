.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;section class=&quot;md-panel&quot; aria-label=&quot;项目健康看板&quot;&gt;&lt;div class=&quot;md-section-top&quot;&gt;&lt;h2&gt;&lt;em&gt;02&lt;/em&gt;项目健康看板&lt;/h2&gt;&lt;span class=&quot;md-time-scope&quot; id=&quot;md-health-summary&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;table class=&quot;md-projects&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;项目 / OP&lt;/th&gt;&lt;th&gt;人工预算执行&lt;small class=&quot;md-note&quot;&gt;所选期间 · 实际 / 预算&lt;/small&gt;&lt;/th&gt;&lt;th&gt;费用预算执行&lt;small class=&quot;md-note&quot;&gt;截至期末 · 累计 / 项目预算&lt;/small&gt;&lt;/th&gt;&lt;th&gt;是否延期&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;md-projects&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;div id=&quot;md-project-detail&quot; hidden&gt;&lt;/div&gt;&lt;details class=&quot;md-rules&quot; id=&quot;md-project-rules&quot;&gt;&lt;summary&gt;项目健康口径与待确认项&lt;/summary&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;人工预算：&lt;/b&gt;比较同一所选期间的人工预算与实际人工成本，实际成本 = Σ（项目实际人天 × 对应 P 值），占比 = 实际 ÷ 同期预算；预算为零或缺失时不生成占比。P 值单价、单位待确认，演示采用元/人天。&lt;/li&gt;&lt;li&gt;&lt;b&gt;费用预算：&lt;/b&gt;比较截至所选期末的项目累计费用与全项目费用预算，费用占比 = 累计费用 ÷ 项目费用预算；不强行把费用预算按里程碑拆月。来源为项目关联的飞书费用。&lt;/li&gt;&lt;li&gt;&lt;b&gt;是否延期：&lt;/b&gt;检查该期间应完成的确收 / 里程碑节点，计划日期到期但未完成确认，或实际确认日期晚于计划日期，标为延期；点击查看具体节点与责任人。历史已延期后补确认仍保留“当期曾延期”事实。&lt;/li&gt;&lt;li&gt;&lt;b&gt;待确认：&lt;/b&gt;预算版本及调整追溯、历史延期展示方式、人工与费用预算的最终对齐口径。本草图明确区分“期间人工预算”和“截至期末费用池”，不混为同一时间口径。&lt;/li&gt;&lt;li&gt;&lt;b&gt;本期不展示：&lt;/b&gt;项目进度百分比与工时百分比的线性比较、统一里程碑模板。项目一条一行，确收与人员闲置移至经营板块。会议 41:56—44:58、55:14—55:39。&lt;/li&gt;&lt;/ul&gt;&lt;/details&gt;&lt;/section&gt;

&lt;details class=&quot;md-rules&quot; id=&quot;md-operating-rules&quot;&gt;&lt;summary&gt;经营指标口径与待确认项&lt;/summary&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;确收：&lt;/b&gt;阶段金额 = 已确认的阶段比例 × 对应净签约金额。预计按计划确认日期汇总；实际仅取已完成确认且实际确认日期落在区间内的记录，需有确认材料与审批依据。每个项目自行定义阶段，不统一套用比例模板。&lt;/li&gt;
&lt;li&gt;&lt;b&gt;比例与差额：&lt;/b&gt;Mock 暂按各阶段增量比例计算，累计比例需先转换为增量，不能重复计入。差额暂定义为预计 − 实际，正值表示未达；比例字段表达及差额正负方向待确认。差额下钻同时列出未按期完成和跨期补确认，保证能对账。&lt;/li&gt;
&lt;li&gt;&lt;b&gt;最新费用框架：&lt;/b&gt;成本下设“项目费用”；OP 费用下设“运营费用、销售费用、财务税费”；经营费用下设“交付产研费用、管理费用、财务费用”。金额按所选月份与 OP 归集，分组小计仅由所属科目相加，不与明细重复相加。科目占比 = 该科目金额 ÷ 本期展示合计。&lt;/li&gt;
&lt;li&gt;&lt;b&gt;项目费用：&lt;/b&gt;本版 Mock 暂沿用 Σ（项目实际人天 × 对应 P 值）+ 项目直接费用，保留与项目看板的金额关联。截图未包含完整科目定义，项目费用是否包含人工、各类费用的具体边界，仍需按完整框架确认。P 值单位演示采用元/人天。&lt;/li&gt;
&lt;li&gt;&lt;b&gt;OP / 经营费用：&lt;/b&gt;运营、销售、交付产研、管理费用分别使用独立模拟金额，不从旧“运营成本”或“其他成本”复制后再累计。后续按飞书费用的核算科目归集；公共经营费用分摊到 OP 的规则需确认，当前 OP 归属仅用于演示筛选，不代表已完成真实数据对接。&lt;/li&gt;
&lt;li&gt;&lt;b&gt;闲置与去重：&lt;/b&gt;闲置成本 = Σ（闲置人天 × 对应 P 值），其在新科目框架中的归属尚未确定，暂列“待归属闲置”，只计入展示合计一次。展示合计 = 七项已分类费用 + 待归属闲置；右侧人员闲置是同一金额的辅助查看，不再次相加。归属确认后应转入对应科目并移除待归属项，不能两边同时保留；销售、售前、管理人员无项目工时不直接判作闲置。&lt;/li&gt;
&lt;li&gt;&lt;b&gt;财务税费 / 财务费用：&lt;/b&gt;按最新要求分别纳入 OP 费用、经营费用，使用两个独立 Mock 科目金额，并按所选月份与 OP 汇总至各自小计和展示合计，不互相复制或重复归集。真实取数来源、两项科目边界、计提算法及组织分摊规则待确认；当前未按确收金额 × 7% 或其他比例计提，未取到的数据也不填成零。本期展示合计不等于公司全口径成本，更不能直接作为法定财务利润。&lt;/li&gt;
&lt;li&gt;&lt;b&gt;依据与来源：&lt;/b&gt;确收沿用《经营看板指标体系与数据口径对齐》会议结论；成本科目按最新补充框架及本次新增两项财务类科目的要求调整。项目、工时预算与普通费用计划来源为飞书记录，新增财务类科目来源待确认；本页仍全部为模拟数据。&lt;/li&gt;
&lt;/ul&gt;&lt;/details&gt;

  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

    target?.nodeType === Node.ELEMENT_NODE

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);

  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

        }

    const content = getContent(trigger);

    }

      updatePosition(trigger, floating);
    });
  };

    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0

      openTooltip(trigger);
      return;

      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);

      return;

      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)

  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {

    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;

      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);

      return;
    }

      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }

      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
