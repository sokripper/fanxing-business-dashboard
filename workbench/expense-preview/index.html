<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>梵行工作台 · 报销双端原型</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202735; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 14px 24px; background: white; border-bottom: 1px solid #e8ebf2; }
    .title { font-size: 17px; font-weight: 650; white-space: nowrap; }
    .tabs { display: flex; gap: 8px; }
    button { border: 1px solid #dbe2f0; border-radius: 8px; background: white; color: #526078; padding: 9px 18px; font: inherit; font-size: 14px; cursor: pointer; }
    button[aria-selected="true"] { background: #4f76e8; border-color: #4f76e8; color: white; }
    .note { font-size: 12px; color: #8090a9; text-align: right; }
    main { height: calc(100dvh - 72px); }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: white; }
    iframe[hidden] { display: none; }
    @media (max-width: 760px) {
      header { flex-wrap: wrap; padding: 12px 14px; }
      .note { display: none; }
      main { height: calc(100dvh - 101px); }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">梵行工作台 · 报销原型</div>
    <nav class="tabs" role="tablist" aria-label="切换报销端口">
      <button id="personal-tab" role="tab" aria-controls="personal-frame" aria-selected="true" type="button">个人侧</button>
      <button id="finance-tab" role="tab" aria-controls="finance-frame" aria-selected="false" type="button">财务侧</button>
    </nav>
    <div class="note">原型演示数据 · 不连接真实业务</div>
  </header>
  <main>
    <iframe id="personal-frame" role="tabpanel" title="个人侧报销原型" src="./P04-c029.html?v=category-lines-1"></iframe>
    <iframe id="finance-frame" role="tabpanel" title="财务侧审核原型" src="./P05-c035.html?v=4ad03f0" hidden></iframe>
  </main>
  <script>
    const tabs = {
      personal: [document.getElementById('personal-tab'), document.getElementById('personal-frame')],
      finance: [document.getElementById('finance-tab'), document.getElementById('finance-frame')]
    };
    function show(side) {
      for (const [name, [button, frame]] of Object.entries(tabs)) {
        const active = name === side;
        button.setAttribute('aria-selected', String(active));
        frame.hidden = !active;
      }
      history.replaceState(null, '', '#' + side);
    }
    for (const [side, [button]] of Object.entries(tabs)) button.addEventListener('click', () => show(side));
    show(location.hash === '#finance' ? 'finance' : 'personal');
  </script>
</body>
</html>
